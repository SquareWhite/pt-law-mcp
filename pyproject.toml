[project]
name = "portuguese-legal-graph-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "fastapi",
    "uvicorn[standard]",
    "neo4j",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "python-dotenv",
    "sentence-transformers>=3.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
